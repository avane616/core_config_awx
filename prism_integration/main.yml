---
- name: Test connectivity from AWX to Prism Central
  hosts: localhost
  gather_facts: no
 
  tasks:
    - name: Check TCP connectivity to Prism Central port 9440
      wait_for:
        host: dnkhovpcp001
        port: 9440
        timeout: 10
      register: connectivity_test
 
    - name: Display connectivity result
      debug:
        msg: "Successfully connected to dnkhovpcp001:9440"
