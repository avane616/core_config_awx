---
- name: Test Prism Central API connectivity
  hosts: localhost
  gather_facts: no

  tasks:
    - name: Test Prism Central API
      uri:
        url: "https://dnkhovpcp001:9440/api/nutanix/v3/clusters/list"
        method: POST
        validate_certs: no
        body_format: json
        body:
          kind: cluster
          length: 1
        status_code:
          - 200
          - 401
      register: result

    - name: Show response
      debug:
        var: result.status
 

