---
- name: Find Nutanix storage container ID from disk UUID
  hosts: localhost
  connection: local
  gather_facts: false
 
  vars:
    prism_central_url: "https://dnkhovpcp001:9440"
    disk_uuid: "88d2a1bb-14f1-43ba-88f4-85e7c43bfe38"
    prism_username: "automation_poc"
 
    # Recommended: pass these from AWX Credential or extra vars
    # prism_username: "{{ lookup('env', 'PRISM_USERNAME') }}"
    # prism_password: "{{ lookup('env', 'PRISM_PASSWORD') }}"
 
    validate_ssl: false
 
  tasks:

    - name: Normalize disk UUID formats
      set_fact:
        disk_uuid_dash: "{{ disk_uuid | lower | replace('_', '-') }}"
        disk_uuid_underscore: "{{ disk_uuid | lower | replace('-', '_') }}"
 
    - name: Validate Prism credentials
      assert:
        that:
          - prism_username is defined
          - prism_username | length > 0
          - prism_password is defined
          - prism_password | length > 0
        fail_msg: "Prism username/password not found. Please pass them from AWX credential."
 
    - name: Query Prism Central virtual disks API
      uri:
        url: "{{ prism_central_url }}/api/nutanix/v2.0/virtual_disks/"
        method: GET
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: true
        validate_certs: "{{ validate_ssl }}"
        headers:
          Accept: "application/json"
      register: virtual_disks
      #no_log: true
 
    - name: Initialize matched disk list
      set_fact:
        matched_disks: []
 
    - name: Search matching virtual disk UUID
      set_fact:
        matched_disks: "{{ matched_disks + [item] }}"
      loop: "{{ virtual_disks.json.entities | default([]) }}"
      when: >
        (
          item.uuid | default('') | lower == disk_uuid_dash
        )
        or
        (
          item.uuid | default('') | lower == disk_uuid_underscore
        )
        or
        (
          item.disk_uuid | default('') | lower == disk_uuid_dash
        )
        or
        (
          item.disk_uuid | default('') | lower == disk_uuid
        )
        or
        (
          item.disk_uuid | default('') | lower == disk_uuid_underscore
        )
        or
        (
          item.vdisk_uuid | default('') | lower == disk_uuid_dash
        )
        or
        (
          item.vdisk_uuid | default('') | lower == disk_uuid_underscore
        )
 
    - name: Fail if disk UUID is not found
      fail:
        msg: "Disk UUID {{ disk_uuid }} was not found in Prism Central virtual disks API."
      when: matched_disks | length == 0
 
    - name: Show matched virtual disk details
      debug:
        msg:
          - "Disk UUID searched       : {{ disk_uuid }}"
          - "Matched UUID            : {{ matched_disks[0].uuid | default('not_found') }}"
          - "Storage Container UUID  : {{ matched_disks[0].storage_container_uuid | default('not_found') }}"
          - "Storage Container ID    : {{ matched_disks[0].storage_container_id | default('not_found') }}"
          - "Disk Size Bytes         : {{ matched_disks[0].disk_capacity_in_bytes | default('not_found') }}"
          - "VM UUID                 : {{ matched_disks[0].vm_uuid | default('not_found') }}"
          - "Full Matched Object     : {{ matched_disks[0] }}"
 
 
