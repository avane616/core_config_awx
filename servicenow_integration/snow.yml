- name: Fetch Open RITMs and Trigger Workflow for Each
  hosts: localhost
  gather_facts: no
  vars: 
    servicenow_instance: "https://hcltechdemosls4.service-now.com"
    assignment_group: "Nutanix%20Automation%20group"
    catalog_item_name: "FileSystem%20Extension"
  tasks:

    - name: Get open RITMs for the catalog item
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_req_item?sysparm_query=active=true^cat_item.name={{ catalog_item_name }}^stateIN1,2&sysparm_fields=sys_id,number,variables"
        #url: "{{ servicenow_instance }}/api/now/table/sc_req_item?sysparm_query=active=true^stateIN1,2&sysparm_fields=sys_id,number,variables"
        #url: "{{ servicenow_instance }}/api/now/table/sc_req_item?sysparm_query=number=RITM0013849" #active=true^cat_item.name={{ catalog_item_name }}" #^stateIN1,2&sysparm_fields=sys_id,number,variables"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        return_content: yes
        headers:
          Accept: "application/json"
      register: ritm_response

    - name: Extract RITM sys_ids and numbers
      set_fact:
        ritm_sys_ids: "{{ ritm_response.json.result | map(attribute='sys_id') | list }}"
        ritm_numbers: "{{ ritm_response.json.result | map(attribute='number') | list }}"

    # - name: Get group approvals for RITMs
    #   uri:
    #     url: "https://{{ servicenow_instance }}/api/now/table/sysapproval_approver?sysparm_query=document_idIN{{ ritm_sys_ids | join(',') }}"
    #     method: GET
    #     user: "{{ user }}"
    #     password: "{{ password }}"
    #     force_basic_auth: yes
    #     return_content: yes
    #     headers:
    #       Accept: "application/json"
    #   register: group_approvals

    # - name: Filter approved RITMs based on group approvals
    #   set_fact:
    #     approved_ritm_ids: >-
    #       {{
    #         group_approvals.json.result
    #         | selectattr('state', 'equalto', 'approved')
    #         | map(attribute='document_id.value')
    #         | list
    #       }}

    # - name: Filter approved RITM numbers
    #   set_fact:
    #     approved_ritm_numbers: >-
    #       {{
    #         ritm_response.json.result
    #         | selectattr('sys_id', 'in', approved_ritm_ids)
    #         | map(attribute='number')
    #         | list
    #       }}

    # - name: Display approved RITM numbers
    #   debug:
    #     msg: "{{ approved_ritm_numbers }}"

    - name: Set RITMs to Work in Progress with a comment
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_req_item?sysparm_query=number={{ item }}"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        return_content: yes
        status_code: 200
      register: ritm_details
      loop: "{{ ritm_numbers }}"
      #loop: "{{ approved_ritm_numbers }}"
      loop_control:
        label: "{{ item }}"

    - name: Update RITM state and work notes
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_req_item/{{ item.json.result[0].sys_id }}"
        method: PUT
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          state: "2"  # Work in Progress
          work_notes: |
            This request has been picked up by the VELUX Automation Team.
            Initial analysis is underway and work has commenced.
            Further updates will be provided as progress continues.
        return_content: yes
        status_code: 200
      loop: "{{ ritm_details.results }}"
      loop_control:
        label: "{{ item.json.result[0].number }}"

    - name: Get variable mappings for each RITM with display values
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_item_option_mtom?sysparm_query=request_item.number={{ ritm_number }}&sysparm_display_value=true"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        return_content: yes
        headers:
          Accept: "application/json"
      register: mtom_response

    - name: Show mtom response
      debug: 
        msg: "{{ mtom_response }}"

    - name: Extract variable sys_ids from sc_item_option links
      set_fact:
        variable_ids: "{{ mtom_response.json.result | map(attribute='sc_item_option.display_value') | list }}"

    - name: Get variable values with item_option details
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_item_option?sysparm_query=sys_idIN{{ variable_ids | join(',') }}&sysparm_display_value=true"
        #url: "{{ servicenow_instance }}/api/now/table/sc_item_option?sysparm_query=sys_idIN{{ variable_ids | join(',') }}&sysparm_display_value=true&sysparm_fields=sys_id,value,item_option"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        return_content: yes
        headers:
          Accept: "application/json"
      register: variable_response

    - name: Debug variable response structure
      debug:
        var: variable_response.json.result

    - name: Map variable names to their values (excluding empty values)
      set_fact:
        variable_map: >-
          {{
            dict(
              variable_response.json.result
              | selectattr('value', 'defined')
              | selectattr('value', '!=', '')
              | map(attribute='sys_id')
              | zip(
                  variable_response.json.result
                  | selectattr('value', 'defined')
                  | selectattr('value', '!=', '')
                  | map(attribute='value')
                )
            )
          }}

    # - name: Map variable names to their values (excluding empty values)
    #   set_fact:
    #     variable_map: >-
    #       {{
    #         dict(
    #           variable_response.json.result
    #           | selectattr('value', 'defined')
    #           | selectattr('value', '!=', '')
    #           | map(attribute='item_option_new.display_value')
    #           | zip(
    #               variable_response.json.result
    #               | selectattr('value', 'defined')
    #               | selectattr('value', '!=', '')
    #               | map(attribute='value')
    #             )
    #         )
    #       }}

    - name: Show variable name-value map
      debug:
        msg: "{{ variable_map }}"

    - name: Set ChangeNumber from RITM response
      set_fact:
        ChangeNumber: "{{ ritm_number }}"

    - name: Get RITM record by number (on success)
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_req_item?sysparm_query=number={{ ritm_number }}"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        return_content: yes
        status_code: 200
      register: ritm_lookup_success

    - name: Get Catalog Tasks for RITM
      uri:
        url: "{{ servicenow_instance }}/api/now/table/sc_task?sysparm_query=assignment_group={{ assignment_group }}^request_item={{ ritm_lookup_success.json.result[0].sys_id }}"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        headers:
          Content-Type: "application/json"
        return_content: yes
        status_code: 200
      register: catalog_tasks

    - name: Display Catalog task details
      debug:
        msg: "{{ catalog_tasks }}"

