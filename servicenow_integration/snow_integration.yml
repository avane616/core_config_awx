# - name: Display approved RITM sys_ids and numbers
#   debug:
#     msg:
#       approved_sys_ids: "{{ approved_ritm_sys_ids }}"
#       approved_numbers: "{{ approved_ritm_numbers }}"

    # Get Catalog Tasks for the approved RITMs (single request, no loop)
    - name: Get Catalog Tasks for approved RITMs
      when: ritm_sys_ids | length > 0
      uri:
        url: "https://{{ servicenow_instance }}/api/now/table/sc_task?sysparm_query=assignment_group={{ assignment_group }}^request_itemIN{{ ritm_sys_ids | join(',') }}"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        headers:
          Accept: "application/json"
        return_content: yes
        status_code: 200
      register: catalog_tasks
      #no_log: true

    - name: Display Catalog task details
      debug:
        var: catalog_tasks

