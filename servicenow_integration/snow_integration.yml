- name: Fetch Open RITMs and Trigger Workflow for Each
  hosts: localhost
  gather_facts: no
  vars: 
    servicenow_instance: "hcltechdemosls4.service-now.com"
    catalog_item_name: "FileSystem%20Extension"
    assignment_group: "Nutanix%20Automation%20group"
  tasks:
  
    # Get open RITMs for the catalog item
    - name: Get open RITMs for the catalog item
      uri:
        url: "https://{{ servicenow_instance }}/api/now/table/sc_req_item?sysparm_query=active=true^cat_item.name={{ catalog_item_name }}^stateIN1,2&sysparm_fields=sys_id,number,variables"
        #url: "https://{{ servicenow_instance }}/api/now/table/sc_req_item?sysparm_query=number=RITM1405337&sysparm_fields=sys_id,number,variables"
        method: GET
        user: "{{ lookup('env', 'user') }}"
        password: "{{ lookup('env', 'password') }}"
        force_basic_auth: yes
        return_content: yes
        headers:
          Accept: "application/json"
      register: ritm_response
      #no_log: true
    
    # Extract RITM sys_ids and numbers
    - name: Extract RITM sys_ids and numbers
      set_fact:
        ritm_sys_ids: "{{ ritm_response.json.result | map(attribute='sys_id') | list }}"
        ritm_numbers: "{{ ritm_response.json.result | map(attribute='number') | list }}"
        # Map RITM sys_id → number for later lookups
        ritm_id_to_number: >-
          {{
            dict(
              (ritm_response.json.result | map(attribute='sys_id') | list)
              | zip(ritm_response.json.result | map(attribute='number') | list)
            )
          }}

# Get group approvals for RITMs
