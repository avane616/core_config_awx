---
- name: Ping Windows Servers
  hosts: localhost
  gather_facts: no

  tasks:

    - name: Add dynamic host to inventory with credentials
      add_host:
        name: "DNKD1VSEANST001"
        groups: dynamic_targets
        ansible_connection: winrm
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
        ansible_user: "automation"
        ansible_password: "{{ prism_password }}"
        ansible_port: 5985

