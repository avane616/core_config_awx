---
- name: Get Nutanix VM details
  hosts: localhost
  gather_facts: false

  vars:
    prism_host: "10.45.203.90"
    prism_username: "automation"
    vm_name: "dnkgevseanst001"
    #additional_memory_gb: "2"
    additional_cpu: "1"

  tasks:

    - name: Fetch VM details
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/list"
        method: POST
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          kind: vm
          filter: "vm_name=={{ vm_name }}"
      register: vm_response

    - name: Fail if VM not found
      fail:
        msg: "VM {{ vm_name }} not found"
      when: vm_response.json.entities | length == 0

    - name: Save VM details
      set_fact:
        vm_details: "{{ vm_response.json.entities[0] }}"

    - name: Display VM details
      debug:
        msg:
          - "VM Name: {{ vm_details.status.name }}"
          - "UUID: {{ vm_details.metadata.uuid }}"
          - "Power State: {{ vm_details.status.resources.power_state }}"
          - "Sockets: {{ vm_details.status.resources.num_sockets }}"
          - "vCPUs per Socket: {{ vm_details.status.resources.num_vcpus_per_socket }}"

    - name: Capture CPU details
      set_fact:
        current_sockets: "{{ vm_details.status.resources.num_sockets | int }}"
        current_vcpus_per_socket: "{{ vm_details.status.resources.num_vcpus_per_socket | int }}"
        current_total_vcpus: "{{ (vm_details.status.resources.num_sockets | int) * (vm_details.status.resources.num_vcpus_per_socket | int) }}"
        vm_uuid: "{{ vm_details.metadata.uuid }}"

    - name: Calculate requested CPU
      set_fact:
        requested_total_vcpus: "{{ current_total_vcpus | int + additional_cpu | int }}"

    - name: Validate requested CPU increase
      fail:
        msg: "CPU increase should be greater than 0"
      when: additional_cpu | int <= 0

    - name: Display current and requested CPU
      debug:
        msg:
          - "Current CPU : {{ current_total_vcpus }} vCPU"
          - "CPU To Add : {{ additional_cpu }} vCPU"
          - "Requested CPU : {{ requested_total_vcpus }} vCPU"

    - name: Get complete VM specification
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}"
        method: GET
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: true
        validate_certs: false
      register: vm_spec

    - name: Build payload
      set_fact:
        vm_update_payload: >-
          {{
            {
              'api_version': vm_spec.json.api_version,
              'metadata': {
                'kind': 'vm',
                'uuid': vm_uuid,
                'spec_version': vm_spec.json.metadata.spec_version | int
              },
              'spec': (
                vm_spec.json.spec |
                combine(
                  {
                    'resources': {
                      'num_sockets': requested_total_vcpus | int,
                      'num_vcpus_per_socket': 1
                    }
                  },
                  recursive=True
                )
              )
            }
          }}

    - name: Display update payload
      debug:
        var: vm_update_payload

    # - name: Update CPU
    #   uri:
    #     url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}"
    #     method: PUT
    #     user: "{{ prism_username }}"
    #     password: "{{ prism_password }}"
    #     force_basic_auth: true
    #     validate_certs: false
    #     body_format: json
    #     status_code:
    #       - 200
    #       - 202
    #     body: "{{ vm_update_payload }}"
    #   register: cpu_update

    # - name: Display update response
    #   debug:
    #     var: cpu_update.json

    # - name: Wait for task completion
    #   pause:
    #     seconds: 30

    - name: Verify updated CPU
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}"
        method: GET
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: true
        validate_certs: false
      register: verify_vm

    - name: Capture updated CPU details
      set_fact:
        final_vcpus: >-
          {{
            (verify_vm.json.spec.resources.num_sockets | int) *
            (verify_vm.json.spec.resources.num_vcpus_per_socket | int)
          }}

    - name: Check CPU increase status
      debug:
        msg: >-
          {% if final_vcpus | int == requested_total_vcpus | int %}
          CPU successfully increased from
          {{ current_total_vcpus }} vCPU to
          {{ final_vcpus }} vCPU.
          {% else %}
          CPU increase verification failed.
          Current CPU detected:
          {{ final_vcpus }} vCPU.
          {% endif %}
