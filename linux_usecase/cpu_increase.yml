---
- name: Get Nutanix VM details
  hosts: localhost
  gather_facts: false

  vars:
    prism_host: "10.45.203.90"
    prism_username: "automation"
    vm_name: "dnkgevseanst001"
    #additional_memory_gb: "2"
    additional_cpu: "2"

  tasks:

    - name: Fetch VM details
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/list"
        method: POST
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: yes
        validate_certs: false
        body_format: json
        headers:
          Content-Type: "application/json"
        body:
          kind: vm
          filter: "vm_name=={{ vm_name | upper }},vm_name=={{ vm_name | lower }}"
      register: vm_response

    - name: Fail if VM not found
      fail:
        msg: "VM {{ vm_name }} not found"
      when: vm_response.json.entities | length == 0

    - name: Save VM details
      set_fact:
        vm_details: "{{ vm_response.json.entities[0] }}"

    - name: Display VM details
      debug:
        msg:
          - "VM Name: {{ vm_details.status.name }}"
          - "UUID: {{ vm_details.metadata.uuid }}"
          - "Power State: {{ vm_details.status.resources.power_state }}"
          - "CPUs (Sockets): {{ vm_details.status.resources.num_sockets }}"
          - "Cores Per CPU: {{ vm_details.status.resources.num_vcpus_per_socket }}"

    - name: Capture CPU details
      set_fact:
        current_sockets: "{{ vm_details.status.resources.num_sockets | int }}"
        current_vcpus_per_socket: "{{ vm_details.status.resources.num_vcpus_per_socket | int }}"
        current_total_vcpus: "{{ (vm_details.status.resources.num_sockets | int) * (vm_details.status.resources.num_vcpus_per_socket | int) | int }}"
        vm_uuid: "{{ vm_details.metadata.uuid }}"

    - name: Validate requested CPU increase
      fail:
        msg: "CPU increase value must be greater than 0"
      when: additional_cpu | int <= 0

    - name: Validate even CPU increase for single CPU VM
      fail:
        msg: "For VMs with 1 CPU, requested vCPU increase must be an even number."
      when:
        - current_sockets == 1
        - (additional_cpu | int) % 2 != 0

    - name: Calculate requested CPU values
      set_fact:
        requested_total_vcpus: "{{ (current_total_vcpus | int) + (additional_cpu | int) }}"
        requested_vcpus_per_socket: "{{ ((current_total_vcpus | int) + (additional_cpu | int)) // (current_sockets | int) }}"

    - name: Validate CPU distribution across CPUs
      fail:
        msg: >-
          Requested CPU increase cannot be evenly distributed across existing CPUs.
          Current CPUs={{ current_sockets }},
          Requested Total vCPU={{ requested_total_vcpus }}
      when:
        - (requested_total_vcpus | int) % (current_sockets | int) != 0

    - name: Display CPU calculation
      debug:
        msg:
          - "Current CPUs (Sockets)      : {{ current_sockets }}"
          - "Current Cores Per CPU       : {{ current_vcpus_per_socket }}"
          - "Current Total vCPU          : {{ current_total_vcpus }}"
          - "Additional vCPU Requested   : {{ additional_cpu }}"
          - "New Cores Per CPU           : {{ requested_vcpus_per_socket }}"
          - "New Total vCPU             : {{ requested_total_vcpus }}"

    #####################################################################
    # Power Off VM (Only if currently ON)
    #####################################################################

    - name: Power OFF VM
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}/set_power_state"
        method: POST
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          transition: "OFF"
      when: power_state == "ON"

    - name: Wait for VM Power OFF
      uri:
        url: "https://{{ prism_host }}:9440/PrismGateway/services/rest/v2.0/vms/{{ vm_uuid }}"
        method: GET
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: yes
        validate_certs: no
      register: vm_status
      until: vm_status.json.power_state == "OFF"
      retries: 20
      delay: 15
      when: power_state == "ON"

    - name: Get complete VM specification
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}"
        method: GET
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: true
        validate_certs: false
      register: vm_spec

    - name: Build CPU update payload
      set_fact:
        vm_update_payload: >-
          {{
            {
              'api_version': vm_spec.json.api_version,
              'metadata': {
                'kind': 'vm',
                'uuid': vm_uuid,
                'spec_version': vm_spec.json.metadata.spec_version | int
              },
              'spec': (
                vm_spec.json.spec |
                combine(
                  {
                    'resources': {
                      'num_sockets': current_sockets | int,
                      'num_vcpus_per_socket': requested_vcpus_per_socket | int
                    }
                  },
                  recursive=True
                )
              )
            }
          }}

    - name: Display update payload
      debug:
        var: vm_update_payload

    - name: Update CPU
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}"
        method: PUT
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: true
        validate_certs: false
        body_format: json
        status_code:
          - 200
          - 202
        body: "{{ vm_update_payload }}"
      register: cpu_update

    - name: Display update response
      debug:
        var: cpu_update.json

    - name: Wait for task completion
      pause:
        seconds: 30
    
    #################################################################
    # Power ON VM
    #################################################################

    - name: Power ON VM
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}/set_power_state"
        method: POST
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: yes
        validate_certs: no
        body_format: json
        body:
          transition: "ON"
      when: power_state == "ON"

    - name: Wait until VM is ON
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}"
        method: GET
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: yes
        validate_certs: no
      register: vm_poweron_status
      until: vm_poweron_status.json.status.resources.power_state == "ON"
      retries: 20
      delay: 15
      when: power_state == "ON"

    - name: Verify updated CPU
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}"
        method: GET
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: true
        validate_certs: false
      register: verify_vm

    - name: Capture updated CPU details
      set_fact:
        final_sockets: "{{ verify_vm.json.spec.resources.num_sockets | int }}"
        final_vcpus_per_socket: "{{ verify_vm.json.spec.resources.num_vcpus_per_socket | int }}"
        final_total_vcpus: "{{ (verify_vm.json.spec.resources.num_sockets | int) * (verify_vm.json.spec.resources.num_vcpus_per_socket | int) }}"

    - name: Check CPU increase status
      debug:
        msg: >-
          {% if final_total_vcpus == requested_total_vcpus | int %}
          CPU successfully increased.
          Previous Configuration:
          {{ current_sockets }} CPU(s) x {{ current_vcpus_per_socket }} Core(s)
          = {{ current_total_vcpus }} vCPU

          Updated Configuration:
          {{ final_sockets }} CPU(s) x {{ final_vcpus_per_socket }} Core(s)
          = {{ final_total_vcpus }} vCPU
          {% else %}
          CPU increase verification failed.
          Expected={{ requested_total_vcpus }}
          Actual={{ final_total_vcpus }}
          {% endif %}
