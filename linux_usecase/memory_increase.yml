---
- name: Validate input
  assert:
    that:
      - vm_name | length > 0
      - additional_memory_gb | int > 0
    fail_msg: "VM name and requested memory increase are mandatory"

- name: Get VM information
  uri:
    url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/list"
    method: POST
    user: "{{ prism_username }}"
    password: "{{ prism_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      kind: vm
      filter: "vm_name=={{ vm_name }}"
  register: vm_info

- name: Verify VM found
  fail:
    msg: "VM {{ vm_name }} not found"
  when: vm_info.json.entities | length == 0

- name: Capture VM details
  set_fact:
    vm_uuid: "{{ vm_info.json.entities[0].metadata.uuid }}"
    current_memory_mb: "{{ vm_info.json.entities[0].spec.resources.memory_size_mib }}"

- name: Calculate requested memory
  set_fact:
    additional_memory_mb: "{{ additional_memory_gb | int * 1024 }}"
    requested_memory_mb: "{{ current_memory_mb | int + (additional_memory_gb | int * 1024) }}"

- name: Verify memory increase is even number
  fail:
    msg: "Memory increase must be in even numbers (2,4,6,8...)"
  when: additional_memory_gb | int is odd

- name: Display current and requested memory
  debug:
    msg:
      - "Current Memory : {{ (current_memory_mb|int/1024)|int }} GB"
      - "Requested Memory : {{ (requested_memory_mb|int/1024)|int }} GB"

- name: Get complete VM specification
  uri:
    url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}"
    method: GET
    user: "{{ prism_username }}"
    password: "{{ prism_password }}"
    force_basic_auth: true
    validate_certs: false
  register: vm_spec

