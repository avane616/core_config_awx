    - name: Verify updated memory
      uri:
        url: "https://{{ prism_host }}:9440/api/nutanix/v3/vms/{{ vm_uuid }}"
        method: GET
        user: "{{ prism_username }}"
        password: "{{ prism_password }}"
        force_basic_auth: true
        validate_certs: false
      register: verify_vm

    - name: Check memory decrease status
      debug:
        msg: >-
          {% if verify_vm.json.spec.resources.memory_size_mib | int == requested_memory_mb | int %}
          Memory successfully decreased
          {% else %}
          No changes in memory decrease
          {% endif %}
