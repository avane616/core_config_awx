    - name: Verify filesystem exists
      command: df -P {{ filesystem_name }}
      register: filesystem_check
      changed_when: false

    - name: Get filesystem utilization
      shell: |
        df -P {{ filesystem_name }} | tail -1 | awk '{print $5}' | sed 's/%//'
      register: fs_utilization
      changed_when: false

    - name: Get logical volume
      shell: |
        df -P {{ filesystem_name }} | tail -1 | awk '{print $1}'
      register: lv_device
      changed_when: false

    - name: Get volume group
      shell: |
        lvs --noheadings -o vg_name {{ lv_device.stdout }} | xargs
      register: vg_details
      changed_when: false
      when: ansible_system == "Linux"

    - name: Get physical volume
      shell: |
        pvs --noheadings -o pv_name,vg_name | grep "{{ vg_details.stdout }}" | awk '{print $1}' | head -1
      register: pv_details
      changed_when: false
      when: ansible_system == "Linux"

    - name: Display precheck details
      debug:
        msg:
          - "Filesystem: {{ filesystem_name }}"
          - "Filesystem Utilization: {{ fs_utilization.stdout }}%"
          - "Logical Volume: {{ lv_device.stdout }}"
          - "Volume Group: {{ vg_details.stdout }}"
          - "Physical Volume: {{ pv_details.stdout }}"

    - name: Capture details
      set_fact:
        vg_name: "{{ vg_details.stdout }}"
        lv_path: "{{ lv_device.stdout }}"
        requested_increase_gb: "{{ additional_disk_gb | float }}"

    #################################################################
    # New Validation and Size Checks
    #################################################################

    - name: Verify LV exists
      stat:
        path: "{{ lv_path }}"
      register: lv_check

    - name: Fail if LV does not exist
      fail:
        msg: "Logical Volume {{ lv_path }} does not exist"
      when: not lv_check.stat.exists

    - name: Get current LV size
      command: lvs --noheadings --units g -o lv_size {{ lv_path }}
      register: current_lv_size
      changed_when: false

    - name: Get VG free space
      command: vgs --noheadings --units g -o vg_free {{ vg_name }}
      register: vg_free_space
      changed_when: false

    - name: Capture disk information
      set_fact:
        current_disk_size_gb: "{{ current_lv_size.stdout | regex_search('[0-9.]+') | float }}"
        vg_free_gb: "{{ vg_free_space.stdout | regex_search('[0-9.]+') | float }}"

    - name: Display disk details
      debug:
        msg:
          - "Current Disk Size: {{ current_disk_size_gb }} GB"
          - "Requested Increase: {{ requested_increase_gb }} GB"
          - "Available VG Free Space: {{ vg_free_gb }} GB"

    - name: Determine whether disk can be extended
      set_fact:
        can_extend_disk: "{{ vg_free_gb >= requested_increase_gb }}"

    - name: Display validation result
      debug:
        msg:
          - "Volume Group has sufficient free space. Proceeding with extension."
      when: can_extend_disk

    - name: Skip extension due to insufficient VG space
      debug:
        msg:
          - "Disk extension skipped."
          - "Current Disk Size: {{ current_disk_size_gb }} GB"
          - "Requested Increase: {{ requested_increase_gb }} GB"
          - "Available VG Free Space: {{ vg_free_gb }} GB"
          - "Insufficient free space in Volume Group."
      when: not can_extend_disk

    #################################################################
    # Extend LV
    #################################################################

    # - name: Extend logical volume
    #   command: lvextend -L +{{ requested_increase_gb }}G {{ lv_path }}
    #   register: lvextend_result
    #   when: can_extend_disk

    # - name: Get filesystem type
    #   command: df -T {{ filesystem_name }}
    #   register: fs_type
    #   changed_when: false
    #   when: can_extend_disk

    # - name: Resize XFS filesystem
    #   command: xfs_growfs {{ filesystem_name }}
    #   when:
    #     - can_extend_disk
    #     - "'xfs' in fs_type.stdout"

    # - name: Resize EXT filesystem
    #   command: resize2fs {{ lv_path }}
    #   when:
    #     - can_extend_disk
    #     - "'ext4' in fs_type.stdout or 'ext3' in fs_type.stdout"

    #################################################################
    # Verification
    #################################################################

    - name: Verify filesystem size after extension
      command: df -h {{ filesystem_name }}
      register: df_output
      changed_when: false

    - name: Display final filesystem details
      debug:
        var: df_output.stdout_lines






