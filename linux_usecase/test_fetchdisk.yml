---
- name: Prepare dynamic targets
  hosts: localhost
  gather_facts: yes

  tasks:
    - name: Include variables
      include_vars:
        file: vars.yml

    - name: Run code compute tasks
      include_tasks: code_compute.yml

    # # Fetch Credentials from CyberArk
    - name: Run code compute tasks
      include_tasks: cyberark.yml
    # - name: Fetch CyberArk credentials
    #   include_role:
    #     name: tools_integration
    #     tasks_from: cyberark_integration.yml

    - name: Dynamically inject target host with CyberArk credentials
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: dynamic_cyberark_targets
        ansible_user: "{{ target_linux_user }}"
        #ansible_user: "automation"
        ansible_password: "{{ target_linux_password }}"
        ansible_ssh_auth_method: password       
        # Privilege Escalation
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_user: root
        ansible_become_password: "{{ target_linux_password }}"
      #no_log: true
      loop: "{{ target_linux_ips }}"
      
- name: B2 - Fetch VM disk UUIDs via Prism Central v3 API
  hosts: localhost
  gather_facts: false
  vars:
    prism_central: "10.45.203.90"     # PC is fine for v3
    pc_user: "automation"
    pc_pass: "{{ prism_password }}"
    vm_name: "DNKGEVSEANST001"
    base_url: "https://{{ prism_central }}:9440/api/nutanix/v3"
 
  tasks:
    - name: List VMs to find the UUID by name
      ansible.builtin.uri:
        url: "{{ base_url }}/vms/list"
        method: POST
        user: "{{ pc_user }}"
        password: "{{ pc_pass }}"
        force_basic_auth: true
        validate_certs: false
        headers:
          Content-Type: "application/json"
        body_format: json
        body:
          kind: "vm"
          filter: "vm_name=={{ vm_name }}"
          length: 20
        return_content: true
      register: vm_list
 
    - name: Extract the VM UUID
      ansible.builtin.set_fact:
        vm_uuid: "{{ (vm_list.json.entities | selectattr('status.name','equalto', vm_name) | first).metadata.uuid }}"
 
    - name: Get full VM spec (includes disk_list)
      ansible.builtin.uri:
        url: "{{ base_url }}/vms/{{ vm_uuid }}"
        method: GET
        user: "{{ pc_user }}"
        password: "{{ pc_pass }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: vm_detail
 
    - name: Show disk UUIDs
      ansible.builtin.debug:
        msg: >-
          {{ vm_detail.json.status.resources.disk_list
             | json_query('[].{device_type: device_properties.device_type,
                               bus: device_properties.disk_address.adapter_type,
                               index: device_properties.disk_address.device_index,
                               vmdisk_uuid: uuid,
                               storage_container_uuid: storage_config.storage_container_reference.uuid,
                               size_bytes: disk_size_bytes}') }}
                               

