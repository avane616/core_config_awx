---
- name: Prepare dynamic targets
  hosts: localhost
  gather_facts: yes

  tasks:
    - name: Include variables
      include_vars:
        file: vars.yml

    - name: Run code compute tasks
      include_tasks: code_compute.yml

    # # Fetch Credentials from CyberArk
    - name: Run code compute tasks
      include_tasks: cyberark.yml
    # - name: Fetch CyberArk credentials
    #   include_role:
    #     name: tools_integration
    #     tasks_from: cyberark_integration.yml

    - name: Dynamically inject target host with CyberArk credentials
      ansible.builtin.add_host:
        name: "{{ item }}"
        groups: dynamic_cyberark_targets
        ansible_user: "{{ target_linux_user }}"
        #ansible_user: "automation"
        ansible_password: "{{ target_linux_password }}"
        ansible_ssh_auth_method: password       
        # Privilege Escalation
        ansible_become: true
        ansible_become_method: sudo
        ansible_become_user: root
        ansible_become_password: "{{ target_linux_password }}"
      #no_log: true
      loop: "{{ target_linux_ips }}"

- name: Fetch Nutanix VM disk UUIDs via Prism Element v2 REST API
  hosts: localhost
  gather_facts: false
  vars:
    prism_element: "10.45.203.90"     # PE / cluster VIP
    prism_user: "automation"
    prism_pass: "{{ prism_password }}"
    vm_name: "DNKGEVSEANST001"
    base_url: "https://{{ prism_element }}:9440/PrismGateway/services/rest/v2.0"
 
  tasks:
    - name: Get all VMs with disk config
      ansible.builtin.uri:
        url: "{{ base_url }}/vms/?include_vm_disk_config=true"
        method: GET
        user: "{{ prism_user }}"
        password: "{{ prism_pass }}"
        force_basic_auth: true
        validate_certs: false
        return_content: true
      register: vms_resp
 
    - name: Isolate our VM
      ansible.builtin.set_fact:
        target_vm: >-
          {{ vms_resp.json.entities
             | selectattr('name', 'equalto', vm_name) | first }}
 
    - name: Show disk UUIDs (vmdisk_uuid, container_uuid, device_bus/index)
      ansible.builtin.debug:
        msg: >-
          {{ target_vm.vm_disk_info
             | json_query('[].{bus: disk_address.device_bus,
                               index: disk_address.device_index,
                               vmdisk_uuid: disk_address.vmdisk_uuid,
                               storage_container_uuid: storage_container_uuid,
                               size: size,
                               is_cdrom: is_cdrom}') }}
 

