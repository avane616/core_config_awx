---
- name: Fetch credentials from CyberArk CCP
  hosts: localhost
  #gather_facts: false
  tasks:
    - name: Check runtime user
      shell: |
        whoami
        id
      register: user_info
     
    - debug:
        var: user_info.stdout
 
    # - name: Fetch password from CyberArk CCP
      # ansible.builtin.uri:
