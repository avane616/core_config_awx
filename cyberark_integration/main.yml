---
- name: Fetch credentials from CyberArk CCP
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Retrieve credentials from CyberArk CCP
      uri:
        url: "{{ ccp_url }}?AppID={{ app_id }}&Safe={{ safe }}&Object={{ object }}"
        method: GET
        validate_certs: false
        return_content: true
        headers:
          Content-Type: "application/json"
      register: cyberark_response
      no_log: true

    - name: Extract username and password
      set_fact:
        cyberark_username: "{{ cyberark_response.json.UserName }}"
        cyberark_password: "{{ cyberark_response.json.Content }}"
      no_log: true

    - name: Display username
      debug:
        msg: "Retrieved username: {{ cyberark_username }}"
