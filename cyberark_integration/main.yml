      # register: cyberark_response
      
    - name: Get credential from CyberArk CCP
      uri:
        url: "https://DNKGEITGCYWQ004.services.internal/AIMWebService/api/Accounts?AppID=AIM-Test-Application&Safe=WIN-VELUX-ALL-LMA-AD-Admin&Object=testaccount"
        method: GET
        timeout: 60
        headers:
          Content-Type: "application/json"
        validate_certs: false
        return_content: true
      register: cyberark_response
      become_user: admin
      #no_log: true
     
    - name: Set password securely
      set_fact:
        ansible_password: "{{ cyberark_response.json.Content }}"
      #no_log: true
   

